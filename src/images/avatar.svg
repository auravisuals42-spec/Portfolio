<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="av-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#152b57"/>
      <stop offset="60%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#040710"/>
    </radialGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f3766"/>
      <stop offset="100%" stop-color="#0c1830"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#av-bg)"/>

  <!-- Ambient Glow Ring -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#4ea1ff" stroke-width="2" opacity="0.3" stroke-dasharray="6 12"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.2"/>

  <!-- Mascot / Avatar Silhouette Graphic -->
  <g transform="translate(150, 160)">
    <!-- Shoulders / Torso -->
    <path d="M 20,420 C 40,290 110,240 150,240 C 190,240 260,290 280,420 Z" fill="url(#jacket-grad)" stroke="#2b487e" stroke-width="2"/>

    <!-- Collar -->
    <polygon points="120,240 150,290 180,240" fill="#2563eb" opacity="0.8"/>
    
    <!-- Head -->
    <ellipse cx="150" cy="160" rx="75" ry="90" fill="#d49b76"/>
    
    <!-- Beard -->
    <path d="M 90,170 C 90,250 210,250 210,170 C 210,210 180,255 150,255 C 120,255 90,210 90,170 Z" fill="#f0ece4"/>

    <!-- Captain Cap -->
    <g transform="translate(70, 50)">
      <ellipse cx="80" cy="45" rx="85" ry="25" fill="#1b2f52" stroke="#4ea1ff" stroke-width="1.5"/>
      <path d="M 0,45 C 5,10 155,10 160,45 Z" fill="#172847"/>
      <!-- Gold Badge -->
      <circle cx="80" cy="40" r="10" fill="#f2c53d"/>
      <polygon points="80,33 83,39 89,40 85,44 86,50 80,47 74,50 75,44 71,40 77,39" fill="#1b2f52"/>
    </g>

    <!-- Eyes (cheerful) -->
    <ellipse cx="125" cy="150" rx="10" ry="12" fill="#ffffff"/>
    <circle cx="127" cy="150" r="6" fill="#120a08"/>
    <circle cx="129" cy="148" r="2" fill="#ffffff"/>

    <ellipse cx="175" cy="150" rx="10" ry="12" fill="#ffffff"/>
    <circle cx="173" cy="150" r="6" fill="#120a08"/>
    <circle cx="175" cy="148" r="2" fill="#ffffff"/>

    <!-- Cheerful Smile -->
    <path d="M 135 180 Q 150 195 165 180" fill="none" stroke="#5a1f22" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(195, 640)">
    <rect width="210" height="42" rx="21" fill="#08142a" stroke="#4ea1ff" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="5" fill="#4ea1ff"/>
    <text x="38" y="26" fill="#ffffff" font-family="'Manrope', sans-serif" font-size="13" font-weight="600">AURAVISUALS CREATOR</text>
  </g>
</svg>