<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="bg-forma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#102042"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4778" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1b33" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg-forma)"/>

  <!-- Architectural Isometric Grid -->
  <g stroke="#1a2e56" stroke-width="0.75" opacity="0.35">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    
    <line x1="100" y1="0" x2="100" y2="550" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="550" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="550" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="550" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="550" stroke-dasharray="4 8"/>
  </g>

  <!-- Minimalist Architectural Monoliths -->
  <g transform="translate(180, 70)">
    <!-- Main Pavilion Block -->
    <polygon points="220,60 380,140 380,340 220,260" fill="url(#pillar)" stroke="#3b629b" stroke-width="1.5"/>
    <polygon points="60,140 220,60 220,260 60,340" fill="#142647" stroke="#3b629b" stroke-width="1.5"/>
    <polygon points="60,140 220,60 380,140 220,220" fill="#1d3866" stroke="#4ea1ff" stroke-width="1.5"/>

    <!-- Cutout Atrium -->
    <polygon points="170,145 220,120 270,145 220,170" fill="#0b172e" stroke="#4ea1ff" stroke-width="1"/>
    <polygon points="170,145 220,170 220,230 170,205" fill="#070f1e" stroke="#2a4778" stroke-width="1"/>
    <polygon points="270,145 220,170 220,230 270,205" fill="#0d1f3b" stroke="#2a4778" stroke-width="1"/>

    <!-- Light beam radiating up -->
    <polygon points="215,120 225,120 240,0 200,0" fill="url(#accent-cyan)" opacity="0.25" filter="url(#glow)"/>

    <!-- Floating Wireframe Cube -->
    <g transform="translate(320, 40) rotate(15)" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.8">
      <polygon points="40,10 80,30 80,70 40,50" />
      <polygon points="0,30 40,10 40,50 0,70" />
      <polygon points="0,30 40,10 80,30 40,50" fill="#38bdf8" fill-opacity="0.1"/>
    </g>
  </g>

  <!-- Studio Blueprint UI Overlay -->
  <g transform="translate(48, 48)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#0b172a" stroke="#223a63" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#4ea1ff"/>
    <text x="24" y="16" fill="#8896b4" font-family="'Manrope', sans-serif" font-size="10" font-weight="600" letter-spacing="1">PROJECT #01</text>

    <text x="0" y="70" fill="#ffffff" font-family="'Barlow Condensed', sans-serif" font-size="32" font-weight="600" letter-spacing="1.5">FORMA ARCHITECTURE</text>
    <text x="0" y="92" fill="#8896b4" font-family="'Manrope', sans-serif" font-size="12">HELSINKI, FINLAND · Timeless Structural Form</text>
  </g>

  <!-- Technical coordinates badge -->
  <g transform="translate(620, 470)">
    <rect x="0" y="0" width="132" height="36" rx="8" fill="#070f1e" stroke="#1d345c" stroke-width="1"/>
    <text x="14" y="16" fill="#4ea1ff" font-family="'Barlow Condensed', sans-serif" font-size="12" font-weight="600">60.1699° N, 24.9384° E</text>
    <text x="14" y="28" fill="#8896b4" font-family="'Manrope', sans-serif" font-size="9">MINIMALIST STUDIO</text>
  </g>
</svg>